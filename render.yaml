# Render Blueprint: one free web service runs the whole app (API + Worker + web pages).
#
# How to use it: Render → New → Blueprint → pick this repository. Render reads this file and then creates the service;
# DATABASE_URL has to be filled in when you create it (the Supabase connection string); every other variable already has a sensible default.
#
# What a free instance is like: it sleeps after 15 minutes with no traffic, and the next visit takes about 30–60 seconds to cold start;
# the worker is stopped while it sleeps too, so jobs stay in the database and processing picks up again once it wakes.
services:
  - type: web
    name: trovia
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/free/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Supabase → Project Settings → Database → Connection string(Session pooler,
      # port 5432). It must be postgresql://…; the backend adds the psycopg3 driver itself.
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      # The default offline implementation: no external key needed, so it works the moment it is deployed.
      - key: AI_PROVIDER
        value: extractive
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_DIM
        value: "1536"
      - key: LOG_LEVEL
        value: INFO
      # A free database cares more about connection count and query volume, so the polling interval is relaxed; this is the longest wait after saving before parsing starts.
      - key: WORKER_POLL_SECONDS
        value: "15"
      - key: XUNJI_WEB_DIR
        value: /app/web
