name: Landing Page

# The landing page is deployed to GitHub Pages (project site: https://<owner>.github.io/<repo>/).
# Only apps/landing is published; the app itself (apps/web) is paused for deployment and does not appear here.
on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a new commit cancels the old one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app entry point on the landing page points at the installer package, not at the paused web app.
      # The site address has to be written as the absolute address of the project site; og:image needs an absolute URL.
      - name: Build landing
        run: npm run build -w @trovia/landing
        env:
          XUNJI_APP_URL: https://github.com/wst7/trovia/releases/latest
          XUNJI_SITE_URL: https://wst7.github.io/trovia

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
