name: Android APK

# Build an installable Android APK straight from the code on GitHub (arm64, release, JS already bundled into the package).
# The app runs fully locally: no backend URL, account or repository variable is needed.
# The artifact is under Artifacts on the Actions run page; when downloading from a phone browser is awkward, download it on a computer and transfer it to the phone.
#
# What is signed here uses the debug key that ships with the RN/Expo template, which is enough for personal installation; to ship on Google Play
# or use proper EAS signing, go through the EAS flow in apps/mobile and do not use this artifact.

# Build only on release tags and manual triggers: everyday commits are not packaged, so no change costs ten-plus minutes of CI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_update:
        description: '只发布热更新，不构建 APK'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # A pure-JS change does not need a new APK: trigger this once by hand and push current main out as an OTA update.
  hot:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag has to be fetched: the version number comes from the latest release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 用最新发布标签当版本号
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          if [ -n "$version" ]; then
            echo "XUNJI_APP_VERSION=$version" >> "$GITHUB_ENV"
          else
            echo "取不到标签，用 app.config 里的兜底版本"
          fi
      - name: 发布热更新
        working-directory: apps/mobile
        run: |
          # eas-cli honours the app config in the cwd, so in a monorepo it has to run inside apps/mobile.
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest channel:edit production --branch production --non-interactive || true
          npx eas-cli@latest update --branch production --message "${GITHUB_SHA::7} hot" --non-interactive --auto

  apk:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_update
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      APP_VARIANT: production
      # Bake the EAS project id into the build so the package can receive OTA updates; without it, it is an ordinary package.
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}

    steps:
      - uses: actions/checkout@v4

      # When tagging v*, write the tag number into the package as the app's versionName (v0.3.1 → 0.3.1).
      - name: 读取发布版本
        if: github.ref_type == 'tag'
        run: echo "XUNJI_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle caching is not enabled: android/ is generated by prebuild and does not exist yet when the workflow starts,
      # so there is no gradle-wrapper.properties and setup-java's cache lookup fails outright.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci

      # The runner ships the Android SDK; here we only accept the licences and let Gradle install any missing platform itself when needed.
      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 发版前跑真实站点
        working-directory: apps/mobile
        run: npm run smoke

      - name: 类型检查
        run: npm run mobile:typecheck

      - name: 生成原生工程
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: 构建 release APK
        working-directory: apps/mobile/android
        # Build for arm64-v8a only: that covers the vast majority of Android phones on sale, builds faster and yields a smaller package.
        # Drop this argument when 32-bit or the emulator is needed (or change it to arm64-v8a,x86_64).
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 重命名产物
        run: |
          src=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          # The file name follows the product: use the version number when tagging (trovia-0.7.1-arm64.apk),
          # and the short commit hash on manual triggers, so two different builds never overwrite each other under one name.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          out="trovia-${version}-arm64.apk"
          cp "$src" "$out"
          echo "APK: $out ($(du -h "$out" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: trovia-apk-${{ github.sha }}
          path: trovia-*-arm64.apk
          if-no-files-found: error
          retention-days: 30

      # OTA update: only the JS is swapped, so users do not have to reinstall the APK. Native changes still have to go through the APK above.
      - name: 发布热更新
        if: startsWith(github.ref, 'refs/tags/v') && env.EXPO_PROJECT_ID != '' && env.EXPO_PROJECT_ID != null
        # A failed OTA release must not drag down the APK build; users can still upgrade by reinstalling.
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "没有 EXPO_TOKEN，跳过（去 expo.dev 建一个再放到仓库 Secrets）"
            exit 0
          fi
          # The channel has to match the expo-channel-name inside the package, otherwise the client request is rejected with a 400.
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest channel:edit production --branch production --non-interactive || true
          npx eas-cli@latest update --branch production --message "$GITHUB_REF_NAME" --non-interactive --auto

      # When tagging v*, publish the APK to the Release so the releases/latest link on the description page actually works.
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes come from the matching version section in docs/CHANGELOG.md; fall back to generated notes when it is missing.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'BEGIN{f=0} /^## /{f=($2==v); next} f' docs/CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "$GITHUB_REF_NAME" trovia-*-arm64.apk --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            echo "CHANGELOG 里没有 $version，用自动生成"
            gh release create "$GITHUB_REF_NAME" trovia-*-arm64.apk --generate-notes
          fi
