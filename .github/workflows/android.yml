name: Android APK

# Build an installable Android APK straight from the code on GitHub (arm64, release, JS already bundled into the package).
# The app runs fully locally: no backend URL, account or repository variable is needed.
# The artifact is under Artifacts on the Actions run page; when downloading from a phone browser is awkward, download it on a computer and transfer it to the phone.
#
# What is signed here uses the debug key that ships with the RN/Expo template, which is enough for personal installation; to ship on Google Play
# or use proper EAS signing, go through the EAS flow in apps/mobile and do not use this artifact.

# Build only on release tags and manual triggers: everyday commits are not packaged, so no change costs ten-plus minutes of CI.
on:
  push:
    tags: ['v*']
  # Manual runs are for rebuilding the APK without touching a tag (testing a
  # build, or rebuilding after a CI failure).
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      APP_VARIANT: production

    steps:
      - uses: actions/checkout@v4

      # When tagging v*, write the tag number into the package as the app's versionName (v0.3.1 → 0.3.1).
      - name: 读取发布版本
        if: github.ref_type == 'tag'
        run: echo "XUNJI_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle caching is not enabled: android/ is generated by prebuild and does not exist yet when the workflow starts,
      # so there is no gradle-wrapper.properties and setup-java's cache lookup fails outright.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci

      # The runner ships the Android SDK; here we only accept the licences and let Gradle install any missing platform itself when needed.
      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 发版前跑真实站点
        working-directory: apps/mobile
        run: npm run smoke

      - name: 类型检查
        run: npm run mobile:typecheck

      - name: 生成原生工程
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # The Gradle distribution host intermittently answers 504 and takes the
      # whole build with it. Try it first, then fall back to a mirror rather than
      # failing a release because one CDN had a bad minute.
      # Included builds (AGP's own :gradle-plugin) resolve from their own
      # repositories, so the project-level mirror in android/build.gradle cannot
      # reach them. An init script injects the mirrors ahead of everything,
      # official repositories stay behind them as fallback.
      - name: 为 Gradle 注入镜像
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          # A repository that answers 5xx gets disabled for the rest of the
          # build and Gradle moves on, so order matters: official first, mirrors
          # as the fallback. The other way around makes a mirror outage fatal
          # before the official repositories are ever tried.
          def officials = [
            'https://dl.google.com/dl/android/maven2',
            'https://repo.maven.apache.org/maven2',
            'https://plugins.gradle.org/m2',
          ]
          def mirrors = [
            'https://maven.aliyun.com/repository/google',
            'https://maven.aliyun.com/repository/public',
            'https://www.jitpack.io',
          ]

          beforeSettings { settings ->
            [settings.pluginManagement, settings.dependencyResolutionManagement].each { handler ->
              handler.repositories {
                officials.each { o -> maven { url o } }
                mirrors.each { m -> maven { url m } }
              }
            }
          }

          allprojects { project ->
            [project.buildscript.repositories, project.repositories].each { repos ->
              officials.each { o -> repos.maven { url o } }
              mirrors.each { m -> repos.maven { url m } }
            }
          }
          EOF
          echo "init 脚本已写入"; cat ~/.gradle/init.d/mirror.gradle | head -5

      - name: 确保 Gradle 分发包可用
        working-directory: apps/mobile/android
        run: |
          url=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\//g')
          echo "wrapper 指向: $url"
          if curl -sSfL -m 90 -o /dev/null "$url"; then
            echo "官方源可用"
            exit 0
          fi
          file=$(basename "$url")
          mirror="https://mirrors.cloud.tencent.com/gradle/$file"
          echo "官方源不可用，改用镜像: $mirror"
          curl -sSfL -m 300 -o /dev/null "$mirror"
          sed -i "s#^distributionUrl=.*#distributionUrl=$mirror#" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: 构建 release APK
        working-directory: apps/mobile/android
        # Build for arm64-v8a only: that covers the vast majority of Android phones on sale, builds faster and yields a smaller package.
        # Drop this argument when 32-bit or the emulator is needed (or change it to arm64-v8a,x86_64).
        # Maven hosts fail transiently often enough that one bad minute should
        # not cost a release. Three attempts, then give up loudly.
        run: |
          for attempt in 1 2 3; do
            echo "=== 构建尝试 $attempt ==="
            if ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon; then
              exit 0
            fi
            echo "第 $attempt 次失败，30 秒后重试"
            sleep 30
          done
          echo "三次构建都失败了"
          exit 1

      - name: 重命名产物
        run: |
          src=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          # The file name follows the product: use the version number when tagging (trovia-0.7.1-arm64.apk),
          # and the short commit hash on manual triggers, so two different builds never overwrite each other under one name.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          out="trovia-${version}-arm64.apk"
          cp "$src" "$out"
          echo "APK: $out ($(du -h "$out" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: trovia-apk-${{ github.sha }}
          path: trovia-*-arm64.apk
          if-no-files-found: error
          retention-days: 30

      # When tagging v*, publish the APK to the Release so the releases/latest link on the description page actually works.
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes come from the matching version section in docs/CHANGELOG.md; fall back to generated notes when it is missing.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'BEGIN{f=0} /^## /{f=($2==v); next} f' docs/CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "$GITHUB_REF_NAME" trovia-*-arm64.apk --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            echo "CHANGELOG 里没有 $version，用自动生成"
            gh release create "$GITHUB_REF_NAME" trovia-*-arm64.apk --generate-notes
          fi
