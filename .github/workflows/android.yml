name: Android APK

# 从 GitHub 上的代码直接构建可安装的 Android APK（arm64，release，JS 已打进包）。
# App 完全本地运行：不需要后端地址、账号或任何仓库变量。
# 产物在 Actions 运行页的 Artifacts 里；手机浏览器不方便下载时，可在电脑上下载后传到手机。
#
# 这里签的是 RN/Expo 模板自带的 debug 密钥，够个人安装使用；要上 Google Play
# 或用 EAS 正式签名，请走 apps/mobile 的 EAS 流程，不要用这份产物。

# 只在发版标签和手动触发时构建：日常提交不打包，避免每次改动都跑十几分钟。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_update:
        description: '只发布热更新，不构建 APK'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 纯 JS 改动不必再发 APK：手动触发一次，把当前 main 推成热更新。
  hot:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 用最新发布标签当版本号
        run: echo "XUNJI_APP_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_ENV"
      - name: 发布热更新
        working-directory: apps/mobile
        run: |
          # eas-cli 认 cwd 里的 app config，monorepo 必须在 apps/mobile 里跑。
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest channel:edit production --branch production --non-interactive || true
          npx eas-cli@latest update --branch production --message "${GITHUB_SHA::7} hot" --non-interactive --auto

  apk:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_update
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      APP_VARIANT: production
      # 建包时把 EAS 项目 id 打进去，包才具备热更新能力；没配就是普通包。
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}

    steps:
      - uses: actions/checkout@v4

      # 打 v* 标签时，把标签号作为 App 的 versionName 写进安装包（v0.3.1 → 0.3.1）。
      - name: 读取发布版本
        if: github.ref_type == 'tag'
        run: echo "XUNJI_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 不启用 Gradle 缓存：android/ 由 prebuild 生成，工作流开始时还没有
      # gradle-wrapper.properties，setup-java 的缓存查找会直接失败。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci

      # runner 自带 Android SDK；这里只接受许可，让 Gradle 需要时自行补装缺失的 platform。
      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 类型检查
        run: npm run mobile:typecheck

      - name: 生成原生工程
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: 构建 release APK
        working-directory: apps/mobile/android
        # 只打 arm64-v8a：覆盖绝大多数在售安卓机，构建更快、包更小。
        # 需要 32 位或模拟器时去掉这个参数（或改成 arm64-v8a,x86_64）。
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 重命名产物
        run: |
          src=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          # 文件名跟着产品走：打 tag 时用版本号（trovia-0.7.1-arm64.apk），
          # 手动触发时用提交短哈希，避免同一个名字覆盖掉不同的构建。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          out="trovia-${version}-arm64.apk"
          cp "$src" "$out"
          echo "APK: $out ($(du -h "$out" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: trovia-apk-${{ github.sha }}
          path: trovia-*-arm64.apk
          if-no-files-found: error
          retention-days: 30

      # 热更新：只换 JS，用户不用重装 APK。原生改了仍然要走上面的 APK。
      - name: 发布热更新
        if: startsWith(github.ref, 'refs/tags/v') && env.EXPO_PROJECT_ID != '' && env.EXPO_PROJECT_ID != null
        # 热更新发布失败不能连累 APK 出包，用户还能靠重装升级。
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "没有 EXPO_TOKEN，跳过（去 expo.dev 建一个再放到仓库 Secrets）"
            exit 0
          fi
          # 通道要和包里的 expo-channel-name 对上，否则客户端请求会被 400 拒掉。
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest channel:edit production --branch production --non-interactive || true
          npx eas-cli@latest update --branch production --message "$GITHUB_REF_NAME" --non-interactive --auto

      # 打 v* 标签时把 APK 发布到 Release，说明页的 releases/latest 入口才点得动。
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 说明取 docs/CHANGELOG.md 里对应版本的小节；没有就退回自动生成。
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'BEGIN{f=0} /^## /{f=($2==v); next} f' docs/CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "$GITHUB_REF_NAME" trovia-*-arm64.apk --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            echo "CHANGELOG 里没有 $version，用自动生成"
            gh release create "$GITHUB_REF_NAME" trovia-*-arm64.apk --generate-notes
          fi
